name: Phase 11 acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend gates
        run: |
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Install frontend exactly
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Static, type, unit, build, and dependency gates
        run: python scripts/check_phase11.py --static-only
      - name: Isolated stack, migrations, recovery, and browser acceptance
        run: python scripts/check_phase11.py --stack-only
      - name: Mocked public and admin browser regression journeys
        run: python scripts/check_phase11.py --browser-only
